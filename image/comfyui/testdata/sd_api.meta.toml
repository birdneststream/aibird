name = "SD Test"
command = "sd"
description = "Test workflow for the API-format + sidecar meta loader."
type = "image"
accessLevel = 0

# Target the positive prompt node. Uses the unambiguous node id "6".
[promptTarget]
node = "6"
input = "text"

[parameters.seed]
type = "int"
default = -1
description = "Random seed."

# Target by title "Sampler" (node 3) — exercises title-based matching.
[[parameters.seed.targets]]
node = "Sampler"
input = "seed"

[parameters.steps]
type = "int"
default = 20
description = "Sampler steps."

# Target by class_type "KSampler" (also node 3) — exercises class matching.
[[parameters.steps.targets]]
node = "KSampler"
input = "steps"
