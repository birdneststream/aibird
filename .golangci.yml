version: "2"
run:
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - bodyclose
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - revive
    - rowserrcheck
    - sqlclosecheck
  disable:
    - cyclop
    - dupl
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - lll
    - maintidx
    - nestif
    - nlreturn
    - varnamelen
    - wrapcheck
    - wsl
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G204
        - G104
      severity: medium
      confidence: medium
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
    misspell:
      locale: US
      ignore-rules:
        - aibird
        - comfyui
        - birdbase
        - birdhole
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - gocritic
          - gocyclo
        path: main\.go
      - linters:
          - gocritic
          - gocyclo
        path: irc/commands/
      - linters:
          - errcheck
        text: Error return value of.*is not checked
      - linters:
          - revive
        text: exported.*should have comment.*or be unexported
      - linters:
          - staticcheck
        text: 'ST1003:'
    paths:
      - vendor
      - bin
      - coverage
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new-from-rev: ""
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - aibird
  exclusions:
    generated: lax
    paths:
      - vendor
      - bin
      - coverage
      - third_party$
      - builtin$
      - examples$
